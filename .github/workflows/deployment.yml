name: Deployment Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]
env:
  APP_URL: https://full-stack-open-part11-bloglist.onrender.com

jobs:
  lint_backend:
    runs-on: ubuntu-latest
    steps:
      - name: Force failure
        if: vars.FORCE_FAIL == 'true'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

  lint_frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Force failure
        if: vars.FORCE_FAIL == 'true'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

  test_backend:
    runs-on: ubuntu-latest
    steps:
      - name: Force failure
        if: vars.FORCE_FAIL == 'true'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test # -- --test-name-pattern='DELETE /api/blogs/:id.*is idempotent'
        env:
          TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  test_frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Force failure
        if: vars.FORCE_FAIL == 'true'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test # -- --test-name-pattern='renders the blog title and details'

  e2e_chromium:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2etests
    steps:
      - name: Force failure
        if: vars.FORCE_FAIL == 'true'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: e2etests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        working-directory: .
        run: ./build_step.sh

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npx playwright test --project=chromium # -g 'login.*succeeds with correct credentials'
        env:
          TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ ! cancelled() }}
        with:
          name: playwright-report-chromium
          path: playwright-report-chromium/
          retention-days: 30

  e2e_firefox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2etests
    steps:
      - name: Force failure
        if: vars.FORCE_FAIL == 'true'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: e2etests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        working-directory: .
        run: ./build_step.sh

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps firefox

      - name: Playwright tests
        run: npx playwright test --project=firefox # -g 'login.*succeeds with correct credentials'
        env:
          TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ ! cancelled() }}
        with:
          name: playwright-report-firefox
          path: playwright-report-firefox/
          retention-days: 30

  e2e_webkit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2etests
    steps:
      - name: Force failure
        if: vars.FORCE_FAIL == 'true'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: e2etests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        working-directory: .
        run: ./build_step.sh

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps webkit

      - name: Playwright tests
        run: npx playwright test --project=webkit # -g 'login.*succeeds with correct credentials'
        env:
          TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ ! cancelled() }}
        with:
          name: playwright-report-webkit
          path: playwright-report-webkit/
          retention-days: 30

  checks_passed:
    if: always()
    needs:
      [
        lint_backend,
        lint_frontend,
        test_backend,
        test_frontend,
        e2e_chromium,
        e2e_firefox,
        e2e_webkit,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  deploy:
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' && !contains(join(github.event.commits.*.message, ', '), '#SKIP') }}
    needs: [checks_passed]
    runs-on: ubuntu-latest
    steps:
      - name: Force failure
        if: vars.FORCE_FAIL == 'true'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Trigger Deployment
        run: curl --fail ${{ secrets.RENDER_DEPLOY_HOOK }}

      - name: Post-Deploy Verification
        run: ./verify_deploy.sh

  tag:
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Force failure
        if: vars.FORCE_FAIL == 'true'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch

  notify_success:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Notify successful deploy to Discord
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: 'success'
          title: 'Bloglist Deployed'
          description: |
            **Message:**  ${{ env.MESSAGE }}

            Live app:     [**full-stack-open-part11-bloglist.onrender.com**](${{ env.APP_URL }})
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          REPOSITORY_URL: ${{ github.event.repository.html_url }}

  notify_failure:
    if: failure()
    needs:
      [
        lint_backend,
        lint_frontend,
        test_backend,
        test_frontend,
        e2e_chromium,
        e2e_firefox,
        e2e_webkit,
        checks_passed,
        deploy,
        tag,
      ]
    runs-on: ubuntu-latest
    env:
      EVENT: ${{ github.event_name }}
      WORKFLOW: ${{ github.workflow }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      JOB: >-
        ${{
          needs.lint_backend.result == 'failure' && 'lint_backend' ||
          needs.lint_frontend.result == 'failure' && 'lint_frontend' ||
          needs.test_backend.result == 'failure' && 'test_backend' ||
          needs.test_frontend.result == 'failure' && 'test_frontend' ||
          needs.e2e_chromium.result == 'failure' && 'e2e_chromium' ||
          needs.e2e_firefox.result == 'failure' && 'e2e_firefox' ||
          needs.e2e_webkit.result == 'failure' && 'e2e_webkit' ||
          needs.deploy.result == 'failure' && 'deploy' ||
          'tag'
        }}
      REPOSITORY: ${{ github.repository }}
      REPOSITORY_URL: ${{ github.event.repository.html_url }}
      SERVER_URL: ${{ github.server_url }}
    steps:
      - name: Notify build, deploy or tag failure to Discord
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: 'failure'
          nodetail: true
          title: 'Failure Details'
          description: |
            **Event:**        `${{ env.EVENT }}`
            **Branch:**       [**`${{ env.BRANCH }}`**](${{ env.REPOSITORY_URL }}/tree/${{ env.BRANCH }})
            **Commit:**       [`${{ env.COMMIT }}`](${{ env.COMMIT_URL }})
            **Message:**      ${{ env.MESSAGE }}
            **Author:**       [`${{ env.AUTHOR }}`](${{ env.SERVER_URL }}/${{ env.USERNAME }})
            **Workflow:**     [`${{ env.WORKFLOW }}`](${{ env.REPOSITORY_URL }}/actions/runs/${{ env.WORKFLOW_RUN_ID }})
            **Job:**          `${{ env.JOB }}`
            **Repository:**   [`${{ env.REPOSITORY }}`](${{ env.REPOSITORY_URL }})

            [**View changes**](${{ github.event.compare }})
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.event.head_commit.id }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          USERNAME: ${{ github.event.head_commit.author.username }}
